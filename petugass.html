<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Petugas — LaporAman SMK Negeri 6 Tangsel</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <!-- Supabase Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --danger: #f43f5e;
      --warning: #fbbf24;
      --success: #34d399;
      --badge-darurat: rgba(244, 63, 94, 0.15);
      --badge-tinggi: rgba(251, 191, 36, 0.15);
      --badge-normal: rgba(56, 189, 248, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--surface-border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
    }

    .brand span {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .bell-wrapper {
      position: relative;
      cursor: pointer;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .bell-wrapper:hover { border-color: var(--primary); }

    .badge-dot {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 9px;
      height: 9px;
      background: var(--danger);
      border-radius: 50%;
      border: 2px solid var(--surface);
      display: none;
    }

    .container {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px;
      flex: 1;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-val {
      font-size: 2rem;
      font-weight: 800;
      margin-top: 8px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    select, input {
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--surface-border);
      padding: 10px 14px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    select:focus, input:focus { border-color: var(--primary); }

    .btn-action {
      background: var(--primary);
      color: #0f172a;
      border: none;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
    }

    .btn-action:hover { background: var(--primary-hover); }

    .report-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .report-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 24px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .report-card:hover {
      border-color: #475569;
      transform: translateY(-2px);
    }

    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      gap: 12px;
    }

    .ticket-badge {
      font-family: monospace;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 10px;
      border-radius: 8px;
    }

    .badges {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .urgency-badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: capitalize;
    }

    .urgency-darurat { background: var(--badge-darurat); color: var(--danger); border: 1px solid rgba(244, 63, 94, 0.3); }
    .urgency-tinggi { background: var(--badge-tinggi); color: var(--warning); border: 1px solid rgba(251, 191, 36, 0.3); }
    .urgency-normal { background: var(--badge-normal); color: var(--primary); border: 1px solid rgba(56, 189, 248, 0.3); }

    .report-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .report-meta span strong { color: #cbd5e1; }

    .report-desc {
      background: #0f172a80;
      padding: 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.6;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 16px;
      white-space: pre-wrap;
    }

    .report-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .status-select {
      font-size: 0.85rem;
      padding: 6px 12px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .toast-popup {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0284c7;
      color: #fff;
      padding: 14px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      display: none;
      font-weight: 600;
      font-size: 0.9rem;
      z-index: 100;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div style="font-size: 1.4rem;">🛡️</div>
    <div>Lapor<span>Aman</span> Officer</div>
  </div>
  <div class="header-actions">
    <button class="bell-wrapper" id="bellBtn" title="Tes Audio Notifikasi">
      🔔
      <div class="badge-dot" id="bellDot"></div>
    </button>
    <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.85rem; font-weight: 600;">Halaman Warga ↗</a>
  </div>
</header>

<div class="container">
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total Masuk</div>
      <div class="stat-val" id="statTotal">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label" style="color: var(--danger)">Darurat / Segera</div>
      <div class="stat-val" id="statUrgent" style="color: var(--danger)">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label" style="color: var(--warning)">Perlu Ditindak</div>
      <div class="stat-val" id="statPending" style="color: var(--warning)">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label" style="color: var(--success)">Selesai</div>
      <div class="stat-val" id="statResolved" style="color: var(--success)">0</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="filters">
      <input type="text" id="searchBox" placeholder="Cari tiket, lokasi, kategori...">
      <select id="filterStatus">
        <option value="all">Semua Status</option>
        <option value="Diterima">Diterima</option>
        <option value="Diproses">Diproses</option>
        <option value="Selesai">Selesai</option>
      </select>
      <select id="filterUrgency">
        <option value="all">Semua Urgensi</option>
        <option value="darurat">Darurat</option>
        <option value="tinggi">Tinggi</option>
        <option value="normal">Normal</option>
      </select>
    </div>
    <button class="btn-action" id="refreshBtn">🔄 Refresh Data</button>
  </div>

  <div class="report-grid" id="reportList">
    <div class="empty-state">Memuat data laporan...</div>
  </div>
</div>

<div class="toast-popup" id="toastBox"></div>

<script>
  // GANTI DENGAN URL & ANON KEY DARI DASHBOARD SUPABASE ANDA
  const SUPABASE_URL = "https://jvoololxozxgswqvfwho.supabase.co";
  const SUPABASE_ANON_KEY = "GANTI_DENGAN_ANON_KEY_ANDA";
  
  let db = null;
  if (window.supabase && SUPABASE_ANON_KEY !== "GANTI_DENGAN_ANON_KEY_ANDA") {
    db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  let allReports = [];
  let lastReportCount = 0;

  function playNotificationChime() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    } catch(e) {}
  }

  function showToast(msg) {
    const toast = document.getElementById("toastBox");
    toast.textContent = msg;
    toast.style.display = "block";
    setTimeout(() => { toast.style.display = "none"; }, 4000);
  }

  async function fetchReports() {
    if (db) {
      // Ambil dari Supabase Cloud
      try {
        const { data, error } = await db.from("reports").select("*").order("id", { ascending: false });
        if (error) throw error;
        allReports = data || [];
        renderUI();
      } catch (err) {
        console.error("Gagal membaca Supabase:", err);
        fallbackLocalStorage();
      }
    } else {
      fallbackLocalStorage();
    }
  }

  function fallbackLocalStorage() {
    // Cadangan otomatis menggunakan localStorage jika Supabase key belum diisi
    const local = JSON.parse(localStorage.getItem("laporAmanReports") || "[]");
    if (local.length > lastReportCount && lastReportCount !== 0) {
      playNotificationChime();
      document.getElementById("bellDot").style.display = "block";
      showToast("🔔 Laporan baru masuk!");
    }
    lastReportCount = local.length;
    allReports = local.slice().reverse();
    renderUI();
  }

  async function updateStatus(ticket, newStatus) {
    if (db) {
      try {
        const { error } = await db.from("reports").update({ status: newStatus }).eq("ticket", ticket);
        if (error) throw error;
        const target = allReports.find(r => r.ticket === ticket);
        if (target) target.status = newStatus;
        showToast(`Status ${ticket} diubah ke ${newStatus}`);
        renderUI();
      } catch (err) {
        alert("Gagal update status: " + err.message);
      }
    } else {
      const local = JSON.parse(localStorage.getItem("laporAmanReports") || "[]");
      const idx = local.findIndex(r => r.ticket === ticket);
      if (idx !== -1) {
        local[idx].status = newStatus;
        localStorage.setItem("laporAmanReports", JSON.stringify(local));
        showToast(`Status ${ticket} diubah ke ${newStatus}`);
        fallbackLocalStorage();
      }
    }
  }

  function renderUI() {
    const query = document.getElementById("searchBox").value.toLowerCase();
    const fStatus = document.getElementById("filterStatus").value;
    const fUrgency = document.getElementById("filterUrgency").value;

    document.getElementById("statTotal").textContent = allReports.length;
    document.getElementById("statUrgent").textContent = allReports.filter(r => r.urgency === "darurat" || r.urgency === "tinggi").length;
    document.getElementById("statPending").textContent = allReports.filter(r => r.status === "Diterima" || r.status === "Diproses").length;
    document.getElementById("statResolved").textContent = allReports.filter(r => r.status === "Selesai").length;

    const filtered = allReports.filter(r => {
      const matchSearch = (r.ticket || "").toLowerCase().includes(query) ||
                          (r.category || "").toLowerCase().includes(query) ||
                          (r.where || "").toLowerCase().includes(query) ||
                          (r.description || "").toLowerCase().includes(query);
      const matchStatus = fStatus === "all" || r.status === fStatus;
      const matchUrgency = fUrgency === "all" || r.urgency === fUrgency;
      return matchSearch && matchStatus && matchUrgency;
    });

    const container = document.getElementById("reportList");
    container.innerHTML = "";

    if (filtered.length === 0) {
      container.innerHTML = `<div class="empty-state">Belum ada laporan masuk atau tidak ada yang sesuai filter.</div>`;
      return;
    }

    filtered.forEach(r => {
      const card = document.createElement("div");
      card.className = "report-card";
      const urgencyClass = `urgency-${r.urgency || 'normal'}`;
      const dateVal = r.created_at || r.created;
      const displayDate = dateVal ? new Date(dateVal).toLocaleString('id-ID') : '-';

      card.innerHTML = `
        <div class="report-header">
          <div class="badges">
            <span class="ticket-badge">${r.ticket}</span>
            <span class="urgency-badge ${urgencyClass}">${r.urgency || 'Informasi'}</span>
          </div>
          <span style="font-size: 0.8rem; color: var(--text-muted);">${displayDate}</span>
        </div>
        <div class="report-meta">
          <span><strong>Kategori:</strong> ${r.category}</span>
          <span><strong>Lokasi:</strong> ${r.where}</span>
          <span><strong>Waktu Kejadian:</strong> ${r.when ? r.when.replace('T', ' ') : '-'}</span>
        </div>
        <div class="report-desc">${r.description}</div>
        <div class="report-footer">
          <label style="font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px;">
            Update Status:
            <select class="status-select" onchange="updateStatus('${r.ticket}', this.value)">
              <option value="Diterima" ${r.status === 'Diterima' ? 'selected' : ''}>Diterima</option>
              <option value="Diproses" ${r.status === 'Diproses' ? 'selected' : ''}>Diproses</option>
              <option value="Selesai" ${r.status === 'Selesai' ? 'selected' : ''}>Selesai</option>
            </select>
          </label>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function initRealtime() {
    if (!db) return;
    db.channel("realtime-reports")
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "reports" }, payload => {
        playNotificationChime();
        document.getElementById("bellDot").style.display = "block";
        showToast("🔔 Laporan Masuk: " + payload.new.ticket);
        allReports.unshift(payload.new);
        renderUI();
      })
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "reports" }, payload => {
        const idx = allReports.findIndex(r => r.ticket === payload.new.ticket);
        if (idx !== -1) {
          allReports[idx] = payload.new;
          renderUI();
        }
      })
      .subscribe();
  }

  document.getElementById("searchBox").addEventListener("input", renderUI);
  document.getElementById("filterStatus").addEventListener("change", renderUI);
  document.getElementById("filterUrgency").addEventListener("change", renderUI);
  document.getElementById("refreshBtn").addEventListener("click", () => {
    fetchReports();
    showToast("Data diperbarui.");
  });

  document.getElementById("bellBtn").addEventListener("click", () => {
    document.getElementById("bellDot").style.display = "none";
    playNotificationChime();
    showToast("Suara notifikasi aktif.");
  });

  window.addEventListener("storage", (e) => {
    if (e.key === "laporAmanReports") fallbackLocalStorage();
  });

  fetchReports();
  initRealtime();
  setInterval(fetchReports, 5000);
</script>
</body>
</html>
